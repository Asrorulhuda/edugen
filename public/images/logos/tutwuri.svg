<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Tut Wuri Handayani Emblem -->
  <defs>
    <radialGradient id="twGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  
  <!-- Outer Five-Petal Frame (Segi Lima) -->
  <polygon points="100,10 185,72 153,172 47,172 15,72" fill="url(#twGrad)" stroke="#facc15" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Inner White Border -->
  <polygon points="100,18 177,75 147,165 53,165 23,75" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9"/>
  
  <!-- Central Blazing Torch (Obor Api) -->
  <!-- Flame -->
  <path d="M100,32 C108,48 122,62 114,80 C110,88 104,90 100,95 C96,90 90,88 86,80 C78,62 92,48 100,32 Z" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M100,42 C105,53 113,62 108,74 C106,78 102,80 100,84 C98,80 94,78 92,74 C87,62 95,53 100,42 Z" fill="#facc15"/>
  <path d="M100,55 C102,62 106,68 103,73 C102,75 100,77 100,79 C100,77 98,75 97,73 C94,68 98,62 100,55 Z" fill="#ffffff"/>
  
  <!-- Torch Handle (Tangkai Obor) -->
  <polygon points="94,95 106,95 104,115 96,115" fill="url(#goldGrad)" stroke="#a16207" stroke-width="1"/>
  <rect x="91" y="93" width="18" height="4" rx="1.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>

  <!-- Spread Golden Wings (Sayap Emas Garuda) -->
  <!-- Left Wing -->
  <g fill="url(#goldGrad)" stroke="#a16207" stroke-width="1">
    <path d="M92,98 C70,92 50,78 36,65 C44,82 56,98 75,108 C60,105 45,95 38,85 C46,102 62,118 85,124 C72,122 58,115 52,108 C62,125 78,136 94,138 Z"/>
    <!-- Right Wing -->
    <path d="M108,98 C130,92 150,78 164,65 C156,82 144,98 125,108 C140,105 155,95 162,85 C154,102 138,118 115,124 C128,122 142,115 148,108 C138,125 122,136 106,138 Z"/>
  </g>

  <!-- Open Book of Knowledge (Buku Terbuka) at the Base -->
  <path d="M100,126 C88,120 70,120 54,128 C64,142 82,142 100,136 C118,142 136,142 146,128 C130,120 112,120 100,126 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <path d="M100,126 L100,146" stroke="#0369a1" stroke-width="1.5"/>
  <path d="M54,128 L54,140 C70,132 88,132 100,138 C112,132 130,132 146,140 L146,128" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Slogan Ribbon (Pita Tut Wuri Handayani) -->
  <path d="M48,154 Q100,165 152,154 Q158,162 148,167 Q100,175 52,167 Q42,162 48,154 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
  <text x="100" y="163.5" font-family="'Arial', sans-serif" font-size="7.5" font-weight="bold" fill="#78350f" text-anchor="middle" letter-spacing="0.8">TUT WURI HANDAYANI</text>
</svg>
